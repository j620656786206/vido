# 內建台灣用語詞庫（sub-7-4）。embed 進 binary；改這個檔 = 新版本，
# `version` 要一起 bump（它進 PromptVersion 與 GlossaryVersion，快取才誠實）。
#
# 兩段，性質不同，不要混：
#   replacements — 後處理「詞級」替換，跑在 OpenCC s2twp 之後。收 OpenCC 漏掉的、
#                  或 LLM 直接用繁體字寫出來的大陸用語（OpenCC 只轉簡→繁，看不到）。
#                  `except` 列出「含這個詞但不能換」的更長片語（電視頻道 ⊃ 視頻）。
#                  比對時較長的 `from` 先做（打印機 → 印表機 先於 打印 → 列印）。
#   terms        — 品牌／App／機構的固定譯法，注入 prompt 的全域 glossary 段。
#                  target 是「台灣人怎麼講」：有慣用中文名就用（好市多），沒有就保留原名。
#                  show 詞彙表的同名條目優先（sub-7-1 抽屜在後，覆蓋這裡）。
#
# 來源：教育部《兩岸常用詞典》兩岸用語對照；Netflix／Apple TV+ 台灣字幕慣例；
# eval-1（2026-09-03）零分例（Life360 被翻成「360 號公路」）；party-mode 2026-09-03。
version: zh-tw-lex-1

