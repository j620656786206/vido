# ==============================================================================
# Vido - Docker Compose Configuration
# ==============================================================================
# Single-container deployment for NAS (Unraid, Synology, etc.)
#
# Quick Start:
#   docker-compose up -d
#
# Access:
#   - Web UI: http://localhost:8080
#   - API: http://localhost:8080/api/v1
#   - Health: http://localhost:8080/health
#
# Volumes:
#   - vido-data: Database and cache files
#   - vido-backups: Backup files
#   - Media folder: Your media library (read-only)
#
# Environment Variables:
#   - MEDIA_PATH: Path to your media library (default: ./media)
#   - See .env.example for all available options
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Vido - Unified API + Web UI
  # ---------------------------------------------------------------------------
  vido:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vido
    restart: unless-stopped
    volumes:
      # Persistent data storage
      - vido-data:/vido-data
      # Backup storage
      - vido-backups:/vido-backups
      # Media library (read-only for security)
      - ${MEDIA_PATH:-./media}:/media:ro
    environment:
      # Server configuration
      - PORT=8080
      - ENV=${ENV:-production}
      # Database configuration
      - DB_PATH=/vido-data/vido.db
      - DB_WAL_ENABLED=${DB_WAL_ENABLED:-true}
      # TMDb configuration (optional)
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_DEFAULT_LANGUAGE=${TMDB_DEFAULT_LANGUAGE:-zh-TW}
      # Metadata fallback providers (opt-in, see .env.example)
      - ENABLE_DOUBAN=${ENABLE_DOUBAN:-false}
      - ENABLE_WIKIPEDIA=${ENABLE_WIKIPEDIA:-false}
      # AI providers (optional) — without these the AI subtitle features stay disabled
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      # ASR / speech recognition (optional). Empty ASR_BASE_URL = OpenAI Whisper;
      # point it at a self-hosted OpenAI-compatible engine to avoid cloud cost.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ASR_BASE_URL=${ASR_BASE_URL:-}
      - ASR_MODEL=${ASR_MODEL:-}
      # AI throttle / spend ceiling
      - AI_MAX_CONCURRENT=${AI_MAX_CONCURRENT:-3}
      - AI_RATE_PER_SEC=${AI_RATE_PER_SEC:-2}
      - AI_RUN_BUDGET_USD=${AI_RUN_BUDGET_USD:-5}
      # Encryption key for stored credentials (qBittorrent, DVR). Auto-derived if empty.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - '${VIDO_PORT:-8080}:8080'

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  # Database and cache storage
  vido-data:
    driver: local
  # Backup storage
  vido-backups:
    driver: local
