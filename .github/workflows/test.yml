# Vido Test Pipeline
# Generated by TEA (Test Architect) - BMAD Framework
# Date: 2026-01-25
#
# 2026-09-06 重排（PR 回饋從 ~9.5 分縮到 ~3.5 分）：
#   原本五個 job 排成一條鏈 lint → test-unit → build → e2e → merge，理由是
#   「前面紅了就省後面的分鐘」。但這個 repo 是 public，Actions 分鐘免費，
#   省分鐘沒意義，牆鐘（等 PR 變綠的時間）才是真成本。實測 run 33980319942：
#   lint 113s + unit 195s + build 54s + e2e 183s + merge 23s = 568s 全部串行。
#   現在 lint / test-unit / test-go / build / serve-smoke 五個 job 同時起跑，
#   只有 e2e 真的需要 build 產物才等它；關鍵路徑變成 build → e2e ≈ 3 分鐘。
#
# Pipeline stages（全部平行，除了標明 needs 的）:
#   lint:             ESLint + Prettier + go vet + staticcheck
#   test-unit:        Vitest（apps/web）
#   build:            Go binary + 前端 production build（給 e2e 用）
#   serve-smoke:      `nx serve api` 真的起得來、回得了 200（retro-10 AI6）
#   test-e2e-sharded: Playwright 4 shards，needs: build
#   merge-test-results: 只在有 shard 紅掉時才合併 HTML 報告

name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: 'Run full test suite'
        required: false
        type: boolean
        default: false

# 同一個 PR 連續 push：取消前一輪，別讓新的一輪排在舊的後面等 runner。
# main 上不取消 —— 每個 main commit 的結果都要留著，才能回頭找是哪一個弄壞的。
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  GO_VERSION: '1.25'
  # Pinned for CI reproducibility — new staticcheck releases can add checks
  # that would break main unexpectedly. Bump deliberately.
  STATICCHECK_VERSION: '2026.1'

jobs:
  # =============================================================================
  # Lint (Code Quality)
  # =============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Download Go dependencies
        working-directory: apps/api
        run: go mod download

      # Go checks run before JS checks so a JS failure does not mask Go issues
      # in the same PR (both surface together on first run).
      - name: Run go vet
        working-directory: apps/api
        run: go vet ./...

      - name: Cache staticcheck binary
        id: staticcheck-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/staticcheck
          key: staticcheck-${{ runner.os }}-${{ env.GO_VERSION }}-${{ env.STATICCHECK_VERSION }}

      - name: Install staticcheck
        if: steps.staticcheck-cache.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}

      - name: Run staticcheck
        working-directory: apps/api
        run: staticcheck ./...

      # Breadcrumb: monitors @nx/eslint/plugin inference for drift.
      # Current behavior (@nx/eslint@22.3.3, plugin.js:184-195): plugin skips
      # workspace-root project when `./src` and `./lib` are absent, so only
      # shared-types, api, web have inferred lint targets. If Nx upstream
      # changes this behavior — or someone creates `./src`/`./lib` at repo root —
      # this count drifts and CI flags it before a silent regression.
      # Context: sprint-status preexisting-fail-root-lint-target (closed 2026-04-14).
      - name: Verify Nx lint target inference (drift breadcrumb)
        run: |
          EXPECTED=3
          ACTUAL=$(pnpm nx show projects --with-target=lint | wc -l | tr -d ' ')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Nx lint target inference drifted: expected $EXPECTED projects, got $ACTUAL"
            echo "Investigate before updating this assertion. Context:"
            echo "  _bmad-output/implementation-artifacts/retro-9-AI4-local-lint-command.md (Errata section)"
            echo "Current lint-target projects:"
            pnpm nx show projects --with-target=lint
            exit 1
          fi

      - name: Run ESLint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Verify git hook permissions
        run: |
          git ls-files -s .husky/pre-commit | grep -q '^100755' \
            || { echo "ERROR: .husky/pre-commit is not 755 in git index"; exit 1; }

  # =============================================================================
  # Unit Tests (Vitest) — 不再等 lint；lint 紅跟 unit 紅是兩件事，一起看比較快
  # =============================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: apps/web
        run: npx vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

  # =============================================================================
  # Serve Smoke Gate (runtime regression net for `nx serve api`)
  # =============================================================================
  # Catches the class-of-bug where a sibling .go file added to apps/api/cmd/api/
  # compiles under `go build`/`go test` (package mode) but breaks `go run` if the
  # nx target ever regresses to single-file mode. Probes a full startup path
  # (SQLite migrations + handler registration + DB query) via the explore-blocks
  # LIST endpoint, which is TMDb-free (no secret needed).
  # Spec: _bmad-output/implementation-artifacts/tech-spec-ci-smoke-gate-nx-serve.md
  serve-smoke:
    name: Serve Smoke Gate (nx serve api)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Download Go dependencies
        working-directory: apps/api
        run: go mod download

      # Warm the Go build cache BEFORE the timed probe so compile time is not
      # charged against the 60s curl budget (a cold ~/.cache/go-build can exceed
      # 60s on ubuntu-latest). `go run ./cmd/api` below then reuses these objects,
      # so the probe budget covers only startup (migrations + bind), not compile.
      - name: Warm Go build cache
        working-directory: apps/api
        run: go build -o /dev/null ./cmd/api

      - name: Create data directory
        run: mkdir -p ${{ github.workspace }}/vido-data

      - name: Start nx serve api (background) and probe smoke endpoint
        run: |
          # `set -m` puts the backgrounded job in its own process group so its
          # PGID equals $!. The trap below then signals the WHOLE tree
          # (pnpm → nx → go run → compiled binary). A plain `kill $!` would hit
          # only pnpm and leak the grandchild server, because `go run` does not
          # forward SIGTERM to the binary it exec's.
          set -m
          pnpm exec nx serve api > /tmp/nx-serve.log 2>&1 &
          SERVER_PID=$!
          trap "kill -- -$SERVER_PID 2>/dev/null || kill $SERVER_PID 2>/dev/null || true" EXIT

          echo "Started nx serve api (PGID=$SERVER_PID); probing /api/v1/explore-blocks..."
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/explore-blocks || true)
            if [ "$code" = "200" ]; then
              echo "✓ Smoke passed on iteration $i (HTTP $code)"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Smoke timeout after 60s. Last HTTP code: $code"
          echo "===== nx serve api log (tail -100) ====="
          tail -100 /tmp/nx-serve.log || echo "(no log captured)"
          exit 1
        env:
          VIDO_DATA_DIR: ${{ github.workspace }}/vido-data
          VIDO_PORT: 8080

  # =============================================================================
  # Build (Single build, shared with all E2E shards) — 從第 0 秒就開始，
  # 因為它在 e2e 的關鍵路徑上；lint / unit 紅了也不該讓 e2e 晚 5 分鐘才知道結果
  # =============================================================================
  build:
    name: Build Frontend & Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Go backend
        working-directory: apps/api
        run: go build -o ../../bin/api ./cmd/api

      - name: Build frontend
        run: npx nx build web --configuration=production
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: http://localhost:8080/api/v1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/api
            dist/apps/web
          retention-days: 1

  # =============================================================================
  # E2E Tests (Parallel Shards, download pre-built artifacts)
  # =============================================================================
  test-e2e-sharded:
    name: E2E Tests (Shard ${{ matrix.shard }}/4)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # 瀏覽器快取：run 33980319942 四個 shard 的「Install Playwright browsers」
      # 分別花了 38s / 63s / 104s / 43s —— 比跑測試本身（29–71s）還久，而且
      # 抖動全看 CDN 心情。快取 key 綁 Playwright 版本，升版就自然失效。
      # 命中時只補系統套件（webkit 需要 libwoff / gstreamer 那一串，runner 沒有）。
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system deps (browsers from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Make backend executable
        run: chmod +x bin/api

      - name: Create data directory
        run: mkdir -p ${{ github.workspace }}/vido-data

      - name: Start Go backend
        run: |
          ./bin/api &
          echo "Waiting for backend to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            sleep 1
          done
        env:
          VIDO_DATA_DIR: ${{ github.workspace }}/vido-data
          VIDO_PORT: 8080
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # The SPA is served by `serve` (SPA fallback for /api/* is what the UI
      # specs' page.route mocks rely on — vite preview does not behave the same
      # and lost 43 UI cases on PR #373). What was flaky was fetching serve@14
      # from the registry inside the readiness window: PR #373 saw 12 shard runs
      # red with ERR_CONNECTION_REFUSED on :4200 because npx had not finished
      # downloading. So install it FIRST with retries, then wait up to 90s and
      # fail loudly instead of letting Playwright run against a closed port.
      - name: Install static server
        run: |
          for attempt in 1 2 3; do
            npm install -g serve@14.2.6 && break
            echo "npm install -g serve failed (attempt $attempt), retrying..."
            sleep 10
          done
          serve --version

      - name: Start frontend (preview mode)
        run: |
          serve dist/apps/web -l 4200 --single &
          echo "Waiting for frontend to be ready..."
          for i in {1..90}; do
            if curl -s http://localhost:4200 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Frontend never became ready on :4200 within 90s"
          exit 1

      - name: Run E2E tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4 --project=chromium --project=webkit-core
        env:
          TEST_ENV: ci
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8080/api/v1

      - name: Upload blob report (for merge)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload test results (traces & screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

  # =============================================================================
  # Merge Test Results & Generate Report — 只在有 shard 紅掉時才跑。
  # 全綠時沒人會去開那份 HTML，卻讓每次 run 多等 ~25s 收尾。
  # =============================================================================
  merge-test-results:
    name: Merge Test Results
    needs: test-e2e-sharded
    runs-on: ubuntu-latest
    if: always() && needs.test-e2e-sharded.result == 'failure'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-shard-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge blob reports into HTML
        run: npx playwright merge-reports --reporter=html ./all-blob-reports/
        continue-on-error: true

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore
